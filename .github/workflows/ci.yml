name: Core, browser and package checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MARSD_E2E_ARTIFACTS: 100
      MARSD_ENFORCE_BUDGETS: 1
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.6.9'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: uv sync --python ${{ matrix.python }} --locked --all-extras
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/marsd
      - run: uv run python scripts/generate_api.py --check
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q -m "not performance" --junitxml=test-results.xml
      - run: uv run pytest -q -m performance -s --junitxml=performance-results.xml
      - if: runner.os == 'Linux'
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npm --prefix web exec -- playwright install chromium
      - run: npm --prefix web run test:e2e
      - run: uv build
      - run: uv run python scripts/check_wheel.py
      - run: uv run python scripts/check_installed.py
      - run: uv run python scripts/dependency_inventory.py --output dependency-inventory.json
      - run: uv run python scripts/record_platform_evidence.py --expected-python ${{ matrix.python }} --junit test-results.xml --browser web/test-results/results.json --output platform-evidence.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: validation-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            test-results.xml
            performance-results.xml
            web/test-results/
            platform-evidence.json
            dependency-inventory.json
            dist/*.whl
            dist/*.tar.gz
