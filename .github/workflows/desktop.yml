name: Native desktop checks
on:
  push:
    paths-ignore: [plan.md]
  pull_request:
    paths-ignore: [plan.md]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            backend: marsd-backend
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            backend: marsd-backend.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            backend: marsd-backend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/src-tauri/target
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.6.9'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf webkit2gtk-driver xvfb
      - run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: rustup default 1.99.1
      - run: rustup target add ${{ matrix.target }}
      - id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ matrix.target }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - id: runtime
        run: python scripts/prepare_desktop_python.py --directory "${{ runner.temp }}/marsd-cpython"
      - run: uv sync --locked --all-extras --python "${{ steps.runtime.outputs.interpreter }}"
      - run: npm --prefix web ci --ignore-scripts
      - id: build
        run: uv run python scripts/build_desktop.py
      - if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ matrix.target }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - run: uv run python scripts/check_desktop_runtime.py --backend desktop/runtime/backend/${{ matrix.backend }} --output desktop-runtime-evidence.json
      - run: cargo test --locked --release --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: cargo test --locked --release --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.target }} frozen_backend_lifecycle_and_proxy -- --ignored
        env:
          MARSD_TEST_BACKEND: ${{ github.workspace }}/desktop/runtime/backend/${{ matrix.backend }}
      - if: runner.os != 'macOS'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
      - if: runner.os == 'Linux'
        run: xvfb-run -a uv run python scripts/check_desktop_install.py --package "$(find desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb -name '*.deb' -print -quit)" --output desktop-install-evidence.json
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          uv run python scripts/check_desktop_install.py --package "$installer" --output desktop-install-evidence.json --native-driver "$PWD/msedgedriver.exe"
      - run: uv run python scripts/check_markdown_policy.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop-runtime-evidence.json
            desktop-install-evidence.*
            desktop/runtime/*license*
            desktop/runtime/cpython-provenance.json
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
# Artifacts are unsigned/ad-hoc. Release signing and clean-machine qualification are separate.
