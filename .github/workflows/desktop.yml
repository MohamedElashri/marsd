name: Experimental native desktop candidates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            backend: marsd-backend
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            backend: marsd-backend.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            backend: marsd-backend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/src-tauri/target
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.6.9'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: rustup default 1.99.1
      - run: rustup target add ${{ matrix.target }}
      - run: uv sync --locked --all-extras
      - run: npm --prefix web ci --ignore-scripts
      - run: uv run python scripts/build_desktop.py
      - run: uv run python scripts/check_desktop_runtime.py --backend desktop/runtime/backend/${{ matrix.backend }} --output desktop-runtime-evidence.json
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.target }} frozen_backend_lifecycle_and_proxy -- --ignored
        env:
          MARSD_TEST_BACKEND: ${{ github.workspace }}/desktop/runtime/backend/${{ matrix.backend }}
      - run: uv run python scripts/check_markdown_policy.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: experimental-desktop-${{ matrix.target }}
          path: |
            desktop-runtime-evidence.json
            desktop/runtime/*license*
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
# This creates unsigned/ad-hoc experimental candidates. It does not certify native UI,
# minimum OS, installer/uninstaller, signing/notarization, or clean-machine support.
