name: Prepare release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Require a matching version tag on the default branch
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/release.py validate
  core:
    needs: validate
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: validate
    uses: ./.github/workflows/desktop.yml
  dependencies:
    needs: validate
    uses: ./.github/workflows/sanad.yml
  draft:
    needs: [validate, core, desktop, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: validation-*
          path: incoming
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: desktop-*
          path: incoming
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sanad-report
          path: incoming/sanad-report
      - name: Assemble only tested assets and their evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          MARSD_BUILD_ATTESTATIONS: ${{ vars.MARSD_BUILD_ATTESTATIONS }}
        run: python scripts/release.py assemble --incoming incoming --output release-assets
      - name: Attest artifacts when repository entitlement is confirmed
        if: vars.MARSD_BUILD_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release-assets/*
      - name: Create an experimental draft without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python scripts/release.py draft --output release-assets
